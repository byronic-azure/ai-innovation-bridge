---
apiVersion: v1
kind: Namespace
metadata:
  name: iua-runtime-attestation
  labels:
    app.kubernetes.io/name: dd7-health-attestor
    app.kubernetes.io/component: attestation
---
apiVersion: v1
kind: Secret
metadata:
  name: dd7-cluster-signing-key
  namespace: iua-runtime-attestation
type: Opaque
data:
  # Base64-encoded signing key (placeholder - replace in production)
  signing-key: ""
...
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dd7-attestor-config
  namespace: iua-runtime-attestation
data:
  # Toggle runtime impl:
  #   go   -> /usr/local/bin/dd7-health-attestor-go
  #   rust -> /usr/local/bin/dd7-health-attestor-rust
  DD7_ATTESTOR_IMPL: "go"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dd7-health-attestor
  namespace: iua-runtime-attestation
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dd7-health-attestor
  namespace: iua-runtime-attestation
  labels:
    app.kubernetes.io/name: dd7-health-attestor
    app.kubernetes.io/component: attestation
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: dd7-health-attestor
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dd7-health-attestor
        app.kubernetes.io/component: attestation
    spec:
      serviceAccountName: dd7-health-attestor
      hostNetwork: false
      hostPID: false
      containers:
      - name: attestor
        image: dd7/health-attestor-unified:gpu-v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: /v1/healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /v1/healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        envFrom:
        - configMapRef:
            name: dd7-attestor-config
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: DD7_PORT
          value: "8080"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        securityContext:
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/master"
        operator: "Exists"
        effect: "NoSchedule"
---
apiVersion: v1
kind: Service
metadata:
  name: dd7-health-attestor
  namespace: iua-runtime-attestation
  labels:
    app.kubernetes.io/name: dd7-health-attestor
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: dd7-health-attestor
